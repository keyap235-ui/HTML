<!DOCTYPE html>
<html>

<head>
    <title>My Food Menu</title>
    <style>
        body {
            font-family: Arial;
            background: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: orange;
        }

        h1+p {
            background: blueviolet;
            padding: 10px 20px;
            border-radius: 8px;
            color: aquamarine;
            display: inline-block;
        }

        ul {
            padding: 0;
            margin-top: 20px;
        }

        ul>li {
            list-style: none;
            font-size: 18px;
            font-weight: bold;
            color: brown;
            padding: 10px 20px;
            margin: 6px auto;
            width: 260px;
            background: whitesmoke;
            border-radius: 8px;
        }

        ul li:nth-child(3) {
            background: rgb(63, 78, 33);
            color: coral;
        }

        .desc {
            color: grey;
            margin-top: 20px;
            font-size: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .desc::first-letter {
            font-size: 220%;
            color: aliceblue;
            font-weight: bold;
        }
        .links {
            margin-top: 25px;
        }

        a {
            color: coral;
            text-decoration: none;
            font-size: 15px;
            margin: 0 12px;
            padding: 0%8px 18px;
            border: 2px solid cornflowerblue;
            border-radius: 8px;
        }

        a:hover {
            background: violet;
            color: beige;
        }
    </style>
 </head>

 <boby>
    <h1>My Food Menu</h1>
    <p>pick your favourite dish and dig in!</p>

    <ul>
        <li>pizza</li>
        <li>burger</li>
        <li>tocos</li>
        <li>noodles</li>
        <li>ice cream</li>
    </ul>

    <p class="desc">Every dish on this menu is made with love and loads of flavour. Try them all and find your favourite!</p>

    <div class="links">
        <a href="#">order now</a>
        <a href="#">see more</a>
    </div>
 </boby>

 </html>
