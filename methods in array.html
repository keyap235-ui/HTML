<!DOCTYPE html>
<html>
<boby>
<h2>JavaScript Array Methods</h2>
<h2>Join() and pop()</h2>
<p>Join() method joins array elements into a string and the pop() method removes the last element from an array.</p>
<p id="myjoin"></p>
<p id="myfirstpop"></p>
<p id="mysecondpop"></p>
<script>
var fruits = ["banana" , "orange" , "apple" , "watermelon"]
document.getElementById("myjoin").innerHTML = fruits.join(" * ");
document.getElementById("myfirstpop").innerHTML = fruits; 
fruits.pop();
document.getElementById("mysecondpop").innerHTML = fruits;
</script>
</boby>
</html>
