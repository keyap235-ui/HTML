<!DOCTYPE html>
<html>

<head>
    <title>My Zoo</title>
    <style>
       
        boby {
            font-family: Arial, sans-serif;

            text-align: center;
            padding: 30px;
        }

        h1 {
            color: aquamarine;
        }

        #zoo {
            border: 2px solid black;
            width: 300px;

            padding: 12px;
            border-radius: 10px;
            background: white;
        }

        .zoo {
            border: 2px solid black;
            width: 6px 0;

            padding: 12px;

        }

  <body>

    <h1>My Zoo</h1>
    <p>Use JavaScript and the DOM to add animals to each cage!</p>
    <div id="zoo">
        <div class="zone">Zone 1: <span id="zone1"></span></div>
        <div class="zone">Zone 2: <span id="zone2"></span></div>
        <div class="zone">Zone 3: <span id="zone3"></span></div>
        <div class="zone">Total Amimals<span id="Total"></span></div>
    </div>

    <br>

    <button onclick="openzoo()">Open The Zoo!</button>

    <p id="zoo-status"></p>
    <script>
        function openzoo() {
            document.getElementById("zone1").innerHTML = "Lion";

            document.getElementById("zone2").innerHTML = "Tiger";

            document.getElementById("zone3").innerHTML = "penguin";

            document.getElementById("total").innerHTML = "3";

            document.getElementById("zoo").style.backgroundcolor  = "lightgreen";

             document.getElementById("zoo-status").document.title + "is now open!";

        }
             
    </script>
</body>

</html>
